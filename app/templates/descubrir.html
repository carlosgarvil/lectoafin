{% extends "base.html" %}
{% block titulo %}Descubrir{% endblock %}
{% block contenido %}
<section class="descubrir">
  <p class="contador" id="contador" aria-live="polite">Cargando…</p>

  <div class="mazo" id="mazo">
    {# La tarjeta la rellena descubrir.js con los datos que devuelve /api/siguiente #}
  </div>

  <div class="botones-voto" id="botones">
    <button class="voto no" id="btn-no" aria-label="Paso (no me gusta)" title="Paso (←)">✕<small>PASO</small></button>
    <button class="voto si" id="btn-si" aria-label="¡Crush! (me gusta)" title="¡Crush! (→)">♥<small>CRUSH</small></button>
  </div>
  <p class="nota">Arrastra la tarjeta o usa las flechas ← → del teclado.</p>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='descubrir.js') }}"></script>
{% endblock %}
